<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#0a0a23"/>
      <stop offset="0.5" stop-color="#2a1a6e"/>
      <stop offset="1" stop-color="#0b3b4a"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1800 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="110" rx="10" fill="url(#bg)"/>

  <g fill="#00f7ff" filter="url(#glow)">
    <circle cx="80" cy="110" r="2.5" opacity="0.8"><animate attributeName="cy" values="115;-5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="110" r="1.8" fill="#ff2e97"><animate attributeName="cy" values="115;-5" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="110" r="3" opacity="0.7"><animate attributeName="cy" values="115;-5" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="110" r="2" fill="#7c3aed"><animate attributeName="cy" values="115;-5" dur="8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="110" r="2.5" fill="#ff2e97"><animate attributeName="cy" values="115;-5" dur="5.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="110" r="2" opacity="0.8"><animate attributeName="cy" values="115;-5" dur="7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="110" r="3" fill="#7c3aed"><animate attributeName="cy" values="115;-5" dur="6.5s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="450" y="64" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" letter-spacing="6" filter="url(#glow)" fill="#00f7ff">
    &lt;/&gt; LANGUAGES &amp; TOOLS
    <animate attributeName="fill" values="#00f7ff;#ff2e97;#7c3aed;#00f7ff" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
