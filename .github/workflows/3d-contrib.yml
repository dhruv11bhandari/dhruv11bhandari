name: Update 3D Contributions

on:
  push:
    paths:
      - ".github/workflows/3d-contrib.yml"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Create a grayscale contribution skyline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("profile-3d-contrib/profile-night-green.svg")
          output = Path("profile-3d-contrib/profile-night-mono.svg")
          svg = source.read_text(encoding="utf-8")

          def grayscale(match):
              red, green, blue = (int(value) for value in match.groups())
              value = round(0.2126 * red + 0.7152 * green + 0.0722 * blue)
              return f"rgb({value}, {value}, {value})"

          svg = re.sub(r"rgb\((\d+),\s*(\d+),\s*(\d+)\)", grayscale, svg)
          svg = svg.replace("#00000f", "#0d1117")
          output.write_text(svg, encoding="utf-8")
          PY

      - name: Commit generated skyline
        run: |
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No skyline changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update 3D contribution skyline"
            git push
          fi
